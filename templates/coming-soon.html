<div class="relative min-h-screen flex items-center justify-center bg-black overflow-hidden">
    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://firebasestorage.googleapis.com/v0/b/desire-loja-final.appspot.com/o/slides%2Fslide1.jpg?alt=media&token=c8b57a3e-329b-4424-9a4c-1e6d7a4e6e3a');"></div>
    <div class="absolute inset-0 bg-black bg-opacity-90"></div>

    <div class="relative z-10 text-center px-4 max-w-2xl mx-auto animate-fade-in-up">
        <!-- Logo or Title -->
        <h1 class="text-6xl md:text-8xl font-extrabold text-white mb-6 tracking-tighter">
            <span class="text-accent">Desire</span>
        </h1>

        <!-- Main Message -->
        <h2 class="text-3xl md:text-4xl font-bold text-white mb-6">
            Em Desenvolvimento
        </h2>

        <p class="text-xl text-gray-300 mb-10 leading-relaxed">
            Abrimos em breve. Prepare-se para uma experiência única de prazer e elegância.
        </p>

        <!-- Newsletter Subscription Form -->
        <form class="flex flex-col sm:flex-row max-w-lg mx-auto mb-10 gap-3 justify-center items-center w-full" id="coming-soon-newsletter-form" onsubmit="app.handleNewsletterSubmit(event)">
            <input type="email" name="email" placeholder="O seu email" required
                class="flex-1 w-full bg-black/60 border border-gray-600 text-white placeholder-gray-400 focus:outline-none focus:border-accent rounded px-5 py-3 text-lg transition-colors">
            <button type="submit" class="w-full sm:w-auto btn btn-primary px-8 py-3 text-lg uppercase tracking-wider font-bold shadow-[0_0_15px_rgba(255,0,0,0.5)] transition-all">
                Notificar-me
            </button>
        </form>

        <!-- Divider -->
        <div class="w-24 h-1 bg-accent mx-auto mb-10 rounded-full"></div>

        <!-- Login Button for Staff/Preview -->
        <button onclick="app.openAuthModal('login')" class="btn btn-outline border-2 border-white text-white hover:bg-white hover:text-black px-8 py-3 text-lg transition-all duration-300 font-bold uppercase tracking-wide">
            <i class="fas fa-lock mr-2"></i> Acesso Restrito
        </button>
    </div>

    <!-- Footer/Copyright -->
    <div class="absolute bottom-6 w-full text-center text-gray-500 text-sm z-10">
        &copy; 2025 Desire. Todos os direitos reservados.
    </div>
</div>
